name: Publish Linux Package Repositories

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: memingo-package-repositories
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm createrepo-c gnupg

      - name: Build native packages
        run: python3 scripts/build-packages.py

      - name: Create repository metadata
        run: python3 scripts/build-linux-repositories.py

      - name: Import and verify signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MEMINGO_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MEMINGO_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.MEMINGO_GPG_KEY_ID }}
        run: |
          set -eu
          if [[ -z "$GPG_PRIVATE_KEY" || -z "$GPG_KEY_ID" || -z "$GPG_PASSPHRASE" ]]; then
            echo "::error::Configure MEMINGO_GPG_PRIVATE_KEY, MEMINGO_GPG_KEY_ID and MEMINGO_GPG_PASSPHRASE before publishing. Unsigned repositories are not deployed."
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          if ! gpg --batch --with-colons --list-secret-keys "$GPG_KEY_ID" | grep -q '^fpr:'; then
            echo "::error::The configured GPG key ID does not identify an imported secret key."
            exit 1
          fi
          printf 'Memingo repository signing validation\n' > /tmp/memingo-gpg-check.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" --detach-sign --output /tmp/memingo-gpg-check.sig /tmp/memingo-gpg-check.txt
          gpg --batch --verify /tmp/memingo-gpg-check.sig /tmp/memingo-gpg-check.txt
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > site/linux/memingo.asc

      - name: Sign APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.MEMINGO_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.MEMINGO_GPG_KEY_ID }}
        run: |
          cd site/linux/apt/dists/stable
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --clearsign --output InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --armor --detach-sign --output Release.gpg Release
          gpg --batch --verify Release.gpg Release
          gpg --batch --verify InRelease

      - name: Sign RPM repository
        env:
          GPG_PASSPHRASE: ${{ secrets.MEMINGO_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.MEMINGO_GPG_KEY_ID }}
        run: |
          set -eu
          # Use RPM's built-in signing macro so RPM expands its internal
          # signature/plaintext filename macros correctly.
          printf '%s\n' "$GPG_PASSPHRASE" > /tmp/memingo-gpg-passphrase
          chmod 600 /tmp/memingo-gpg-passphrase
          trap 'rm -f /tmp/memingo-gpg-passphrase' EXIT
          cat > "$HOME/.rpmmacros" <<EOF
          %_signature gpg
          %_gpg_name $GPG_KEY_ID
          %_gpg_path $HOME/.gnupg
          %_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file /tmp/memingo-gpg-passphrase
          EOF
          if ! rpm --eval '%{?_gpg_sign_cmd_extra_args:available}' | grep -q available; then
            echo "::error::This RPM version does not support _gpg_sign_cmd_extra_args."
            exit 1
          fi
          for package in dist/*.rpm; do
            rpmsign --addsign "$package"
          done
          rpm --import site/linux/memingo.asc
          for package in dist/*.rpm; do
            rpm --checksig --verbose "$package"
          done
          cp dist/*.rpm site/linux/rpm/Packages/
          createrepo_c --update --database site/linux/rpm
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --armor --detach-sign \
            --output site/linux/rpm/repodata/repomd.xml.asc \
            site/linux/rpm/repodata/repomd.xml
          gpg --batch --verify site/linux/rpm/repodata/repomd.xml.asc site/linux/rpm/repodata/repomd.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy repositories
        id: deployment
        uses: actions/deploy-pages@v4
