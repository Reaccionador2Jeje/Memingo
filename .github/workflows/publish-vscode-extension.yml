name: Publish VS Code Extension

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package Web VSIX
        working-directory: vscode-extension
        run: |
          npx --yes @vscode/vsce package --target web
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: memingo-vscode-extension-web
          path: vscode-extension/*.vsix
          if-no-files-found: error
      - name: Publish Web Extension to Visual Studio Marketplace with OIDC
        working-directory: vscode-extension
        run: |
          npx --yes @vscode/vsce publish --target web --oidc
