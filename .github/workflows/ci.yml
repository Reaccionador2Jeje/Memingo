name: Memingo CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run language tests
        run: python -m unittest discover -s tests -v
      - name: Run package tests
        run: python -m compileall -q memingo

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python-build python-installer python-setuptools python-wheel sudo
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate metadata and build the AUR package
        run: |
          sudo -u builder bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg --printsrcinfo > .SRCINFO.generated && diff -u .SRCINFO .SRCINFO.generated && rm .SRCINFO.generated && makepkg --syncdeps --noconfirm --cleanbuild'

  native-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RPM builder
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build DEB package
        run: python3 scripts/build-packages.py --only deb
      - name: Build RPM package
        run: python3 scripts/build-packages.py --only rpm
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: memingo-linux-packages
          path: dist/*
