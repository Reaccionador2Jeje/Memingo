name: Memingo Desktop Apps
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Build Windows app and setup wizard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --windowed --name Memingo --collect-all memingo scripts/desktop_entry.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup wizard
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers/windows/Memingo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: memingo-windows
          path: |
            dist/Memingo-Setup-*-windows-x64.exe
            dist/Memingo/
          if-no-files-found: error
          retention-days: 30
  macos:
    name: Build macOS app and DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller
      - name: Build application bundle
        run: pyinstaller --noconfirm --clean --windowed --name Memingo --osx-bundle-identifier dev.atdev.memingo --collect-all memingo scripts/desktop_entry.py
      - name: Create DMG installer
        run: |
          mkdir -p dist/dmg
          cp -R dist/Memingo.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Memingo" -srcfolder dist/dmg -ov -format UDZO "dist/Memingo-0.2.0-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: memingo-macos
          path: |
            dist/Memingo-0.2.0-macos.dmg
            dist/Memingo.app
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Memingo \${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/memingo-windows/Memingo-Setup-*-windows-x64.exe
            release-files/memingo-macos/Memingo-0.2.0-macos.dmg
