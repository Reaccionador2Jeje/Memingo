name: Gold & Diamond Browser

on:
  push:
    paths:
      - "projects/gold-diamond-browser/**"
      - "memingo/**"
      - ".github/workflows/gold-diamond-browser.yml"
  pull_request:
    paths:
      - "projects/gold-diamond-browser/**"
      - "memingo/**"
      - ".github/workflows/gold-diamond-browser.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Memingo app and Python host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Memingo runtime
        run: python -m pip install .
      - name: Validate Memingo application
        run: memingo check projects/gold-diamond-browser/app.mgo
      - name: Compile Python host
        run: python -m compileall -q projects/gold-diamond-browser/gold_diamond_browser
